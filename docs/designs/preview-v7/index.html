<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brief — Je parle, c'est rangé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BRIEF — design system
   ============================================================ */
:root {
  --bg: #F4F1EA;
  --surface: #FBF9F4;
  --surface-2: #EFEAE0;
  --ink: #1A1814;
  --ink-2: #4A453C;
  --ink-3: #8A8378;
  --line: #DDD6C6;
  --line-2: #C9C0AC;
  --accent: #B8551F;
  --accent-soft: #F2E2D2;
  --late: #B5301E;
  --late-soft: #F0DAD6;
  --done: #4A6B3A;
  --done-soft: #DCE5D2;

  --p-admin: #B8551F;
  --p-admin-soft: #F2E2D2;
  --p-admin-shape: square;

  --p-sante: #4A6B3A;
  --p-sante-soft: #DCE5D2;
  --p-sante-shape: triangle;

  --p-epitech: #6B5B95;
  --p-epitech-soft: #DEDAE6;
  --p-epitech-shape: diamond;

  --p-perso: #B58A1F;
  --p-perso-soft: #EFE2C8;
  --p-perso-shape: circle;

  --p-articles: #2F6B7A;
  --p-articles-soft: #D2DEE2;
  --p-articles-shape: hexagon;

  --shadow: 0 1px 0 rgba(26,24,20,0.04), 0 8px 24px -12px rgba(26,24,20,0.12);
  --shadow-lg: 0 1px 0 rgba(26,24,20,0.04), 0 24px 60px -20px rgba(26,24,20,0.22);
  --radius: 14px;
  --radius-sm: 8px;
  --tap: 44px;
}

[data-theme="dark"] {
  --bg: #16140F;
  --surface: #1E1B15;
  --surface-2: #25211A;
  --ink: #F2EDE0;
  --ink-2: #C2BAA8;
  --ink-3: #8A8378;
  --line: #2E2920;
  --line-2: #3D362A;
  --accent: #E89055;
  --accent-soft: #2A1F14;
  --late: #E07260;
  --late-soft: #2A1814;
  --done: #8FB074;
  --done-soft: #1C2418;

  --p-admin: #E89055;
  --p-admin-soft: #2A1F14;
  --p-sante: #8FB074;
  --p-sante-soft: #1C2418;
  --p-epitech: #A89BC4;
  --p-epitech-soft: #221F2A;
  --p-perso: #D4A94A;
  --p-perso-soft: #2A2114;
  --p-articles: #6FA8B8;
  --p-articles-soft: #18242A;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
.serif { font-family: 'Fraunces', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
::selection { background: var(--accent); color: var(--surface); }

/* ============================================================
   Layout shell
   ============================================================ */
.shell {
  display: grid;
  grid-template-columns: 248px 1fr;
  height: 100vh;
  width: 100vw;
  transition: grid-template-columns .25s ease;
}
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 22px 18px;
  overflow-y: auto;
}
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  gap: 16px;
  flex-shrink: 0;
}
.content {
  flex: 1;
  overflow-y: auto;
  padding: 28px 32px 80px;
}

/* ============================================================
   Sidebar
   ============================================================ */
.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 28px;
  padding: 0 4px;
}
.brand-mark {
  width: 28px; height: 28px;
  background: var(--ink);
  border-radius: 50%;
  position: relative;
  flex-shrink: 0;
  align-self: center;
}
.brand-mark::after {
  content: '';
  position: absolute;
  inset: 6px;
  border-radius: 50%;
  background: var(--accent);
  transform: scale(.5);
  transition: transform .3s ease;
}
.brand:hover .brand-mark::after { transform: scale(.85); }
.brand-name { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.brand-tag { font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; }

.nav-section { margin-bottom: 22px; }
.nav-label {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 0 10px 8px;
  font-weight: 500;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 500;
  width: 100%;
  text-align: left;
  transition: background .15s, color .15s;
  min-height: 38px;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--ink); color: var(--surface); }
.nav-item.active .nav-count { background: rgba(255,255,255,0.15); color: var(--surface); }
.nav-glyph {
  width: 16px; height: 16px;
  flex-shrink: 0;
  display: grid; place-items: center;
}
.nav-glyph svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.nav-count {
  margin-left: auto;
  font-size: 11px;
  font-weight: 500;
  background: var(--surface-2);
  color: var(--ink-3);
  padding: 2px 7px;
  border-radius: 10px;
  font-variant-numeric: tabular-nums;
}

.project-list { display: flex; flex-direction: column; gap: 2px; }
.project-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  color: var(--ink-2);
  font-size: 14px;
  width: 100%;
  text-align: left;
  transition: background .15s;
  min-height: 38px;
}
.project-item:hover { background: var(--surface-2); }
.project-mark {
  width: 14px; height: 14px;
  flex-shrink: 0;
  position: relative;
}
.project-mark::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--p-color, var(--ink-3));
}
.project-mark.shape-square::before { border-radius: 2px; }
.project-mark.shape-triangle::before {
  background: none;
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-bottom: 12px solid var(--p-color);
  inset: 1px 0 0 0;
}
.project-mark.shape-diamond::before { transform: rotate(45deg); width: 10px; height: 10px; inset: 2px; }
.project-mark.shape-circle::before { border-radius: 50%; }
.project-mark.shape-hexagon::before {
  clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
}

.sidebar-footer {
  margin-top: auto;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--ink-3);
}
.theme-toggle {
  margin-left: auto;
  width: 36px; height: 36px;
  border-radius: 50%;
  display: grid; place-items: center;
  color: var(--ink-2);
  transition: background .15s;
}
.theme-toggle:hover { background: var(--surface-2); }
.theme-toggle svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }

/* ============================================================
   Topbar
   ============================================================ */
.topbar-title { display: flex; flex-direction: column; gap: 2px; }
.topbar-title h1 { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 500; letter-spacing: -0.02em; }
.topbar-title .sub { font-size: 13px; color: var(--ink-3); }
.topbar-actions { display: flex; align-items: center; gap: 10px; }

.view-switch {
  display: flex;
  background: var(--surface-2);
  border-radius: 10px;
  padding: 3px;
  gap: 2px;
}
.view-switch button {
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-3);
  border-radius: 7px;
  transition: all .15s;
}
.view-switch button:hover { color: var(--ink-2); }
.view-switch button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

.btn-ghost {
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  transition: background .15s;
  display: flex; align-items: center; gap: 8px;
}
.btn-ghost:hover { background: var(--surface-2); }
.btn-ghost svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }

.btn-primary {
  background: var(--ink);
  color: var(--surface);
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  transition: background .15s, transform .1s;
  min-height: 40px;
}
.btn-primary:hover { background: #2A2620; }
[data-theme="dark"] .btn-primary:hover { background: #2E2A22; }
.btn-primary:active { transform: scale(.98); }
.btn-primary svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }

.device-toggle {
  display: flex;
  background: var(--surface-2);
  border-radius: 10px;
  padding: 3px;
}
.device-toggle button {
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-3);
  border-radius: 7px;
  display: flex; align-items: center; gap: 6px;
}
.device-toggle button.active { background: var(--surface); color: var(--ink); }
.device-toggle svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }

/* ============================================================
   Task rows
   ============================================================ */
.task {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 16px;
  border-radius: var(--radius);
  transition: background .15s;
  cursor: pointer;
  position: relative;
}
.task:hover { background: var(--surface); }
.task.done .task-title { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-3); }
.task.late { background: var(--late-soft); }
.task.late:hover { background: var(--late-soft); filter: brightness(0.97); }
[data-theme="dark"] .task.late:hover { filter: brightness(1.15); }

.checkbox {
  width: 20px; height: 20px;
  border: 1.5px solid var(--line-2);
  border-radius: 6px;
  flex-shrink: 0;
  margin-top: 1px;
  display: grid; place-items: center;
  transition: all .15s;
  cursor: pointer;
  background: var(--surface);
}
.task:hover .checkbox { border-color: var(--ink-3); }
.checkbox.checked {
  background: var(--done);
  border-color: var(--done);
}
.checkbox.checked::after {
  content: '';
  width: 10px; height: 6px;
  border-left: 2px solid white;
  border-bottom: 2px solid white;
  transform: rotate(-45deg) translate(1px, -1px);
}
.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 15px; font-weight: 500; color: var(--ink); line-height: 1.4; }
.task-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
  font-size: 12px;
  color: var(--ink-3);
  flex-wrap: wrap;
}
.task-project {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
  color: var(--ink-2);
}
.task-project .pmark {
  width: 8px; height: 8px;
  background: var(--p-color);
  position: relative;
  flex-shrink: 0;
}
.task-project .pmark.shape-square { border-radius: 1px; }
.task-project .pmark.shape-triangle {
  background: none;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-bottom: 7px solid var(--p-color);
  width: 0; height: 0;
}
.task-project .pmark.shape-diamond { transform: rotate(45deg); width: 7px; height: 7px; }
.task-project .pmark.shape-circle { border-radius: 50%; }
.task-project .pmark.shape-hexagon { clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); }

.task-time { font-variant-numeric: tabular-nums; }
.task-late-badge {
  color: var(--late);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.task-actions {
  display: flex;
  gap: 6px;
  opacity: 0;
  transition: opacity .15s;
  flex-shrink: 0;
}
.task:hover .task-actions { opacity: 1; }
.task.late .task-actions { opacity: 1; }
.task-action {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  background: var(--surface);
  color: var(--ink-2);
  border: 1px solid var(--line);
  transition: all .15s;
  min-height: 32px;
  display: flex; align-items: center; gap: 5px;
}
.task-action:hover { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.task-action.primary { background: var(--done); color: white; border-color: var(--done); }
.task-action.primary:hover { background: var(--done); filter: brightness(0.92); }
.task-action svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; }

/* ============================================================
   Day plan sections
   ============================================================ */
.day-section { margin-bottom: 28px; }
.day-section-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 10px;
  padding: 0 4px;
}
.day-section-title {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.day-section-count {
  font-size: 12px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.day-section-line {
  flex: 1;
  height: 1px;
  background: var(--line);
}

/* ============================================================
   Dictation panel
   ============================================================ */
.dictation {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 50;
}
.mic-fab {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--surface);
  display: grid; place-items: center;
  box-shadow: var(--shadow-lg);
  transition: all .2s;
  position: relative;
}
.mic-fab:hover { transform: scale(1.05); }
.mic-fab.listening { background: var(--accent); }
.mic-fab.listening::before {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  animation: pulse 1.5s ease-out infinite;
}
@keyframes pulse {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(1.4); opacity: 0; }
}
.mic-fab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; }

.dictation-panel {
  position: absolute;
  bottom: 76px;
  right: 0;
  width: 380px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
  padding: 22px;
  display: none;
  flex-direction: column;
  gap: 16px;
}
.dictation-panel.open { display: flex; }
.dictation-head { display: flex; align-items: center; justify-content: space-between; }
.dictation-status {
  font-size: 12px;
  color: var(--accent);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}
.dictation-status::before {
  content: '';
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  animation: blink 1s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: 0.3; } }
.dictation-close { color: var(--ink-3); padding: 4px; }
.dictation-close svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }

.transcript {
  font-family: 'Fraunces', serif;
  font-size: 17px;
  line-height: 1.5;
  color: var(--ink);
  min-height: 80px;
  padding: 14px 16px;
  background: var(--bg);
  border-radius: 12px;
  font-weight: 400;
}
.transcript .typed { opacity: 1; }
.transcript .cursor {
  display: inline-block;
  width: 2px;
  height: 18px;
  background: var(--accent);
  vertical-align: text-bottom;
  margin-left: 1px;
  animation: cursor-blink 1s steps(2) infinite;
}
@keyframes cursor-blink { 50% { opacity: 0; } }

.parsed-tasks {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}
.parsed-task {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg);
  border-radius: 10px;
  font-size: 14px;
}
.parsed-task .checkbox { width: 16px; height: 16px; }
.parsed-task-title { flex: 1; font-weight: 500; }
.parsed-task-time { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.dictation-actions { display: flex; gap: 8px; }
.dictation-actions .btn-primary { flex: 1; justify-content: center; }
.btn-secondary {
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-2);
  background: var(--surface-2);
  transition: background .15s;
}
.btn-secondary:hover { background: var(--line); }

/* ============================================================
   Triage modal
   ============================================================ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(26,24,20,0.4);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  backdrop-filter: blur(2px);
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 18px;
  padding: 28px;
  max-width: 440px;
  width: 100%;
  box-shadow: var(--shadow-lg);
  animation: modal-in .25s ease;
}
@keyframes modal-in {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: none; }
}
.modal-title { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; margin-bottom: 6px; letter-spacing: -0.01em; }
.modal-sub { font-size: 14px; color: var(--ink-3); margin-bottom: 22px; }
.modal-task-preview {
  padding: 14px 16px;
  background: var(--bg);
  border-radius: 12px;
  margin-bottom: 20px;
  font-weight: 500;
  font-size: 15px;
}

.project-picker {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.pick-project {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border-radius: 12px;
  background: var(--bg);
  border: 1.5px solid transparent;
  transition: all .15s;
  text-align: left;
  min-height: 56px;
}
.pick-project:hover { border-color: var(--line-2); }
.pick-project.selected { border-color: var(--p-color); background: var(--p-soft); }
.pick-project .project-mark { width: 18px; height: 18px; }
.pick-project .project-mark.shape-triangle::before {
  border-left: 9px solid transparent;
  border-right: 9px solid transparent;
  border-bottom: 15px solid var(--p-color);
}
.pick-project .project-mark.shape-diamond::before { width: 13px; height: 13px; inset: 2px; }
.pick-project-name { font-weight: 500; font-size: 14px; }
.pick-project-count { font-size: 12px; color: var(--ink-3); margin-left: auto; }

.modal-actions { display: flex; gap: 10px; margin-top: 22px; }
.modal-actions .btn-primary { flex: 1; justify-content: center; }

/* ============================================================
   Confirm modal
   ============================================================ */
.confirm-modal { max-width: 380px; text-align: center; }
.confirm-modal .modal-title { margin-bottom: 12px; }
.confirm-modal .modal-sub { margin-bottom: 24px; }
.confirm-actions { display: flex; gap: 10px; }
.confirm-actions button { flex: 1; padding: 12px; border-radius: 10px; font-weight: 500; font-size: 14px; min-height: 44px; }
.confirm-yes { background: var(--done); color: white; }
.confirm-no { background: var(--surface-2); color: var(--ink-2); }

/* ============================================================
   Kanban
   ============================================================ */
.kanban {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 12px;
  min-height: 100%;
}
.kanban-column {
  flex: 0 0 280px;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: calc(100vh - 200px);
  overflow-y: auto;
}
.kanban-column.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.kanban-col-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 6px 8px;
}
.kanban-col-title {
  font-family: 'Fraunces', serif;
  font-size: 16px;

/* ============================================================
   Calendar
   ============================================================ */
.calendar {

}

}
.cal-day.other-month { background: var(--bg); opacity: 0.5; }
.cal-day.today { background: var(--accent-soft); }
.cal-day-num {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

}
.cal-event {
  font-size: 11px;
  padding: 3px 6px;
  border-radius: 4px;
  background: var(--p-soft);
  color: var(--ink-2);

  overflow: hidden;
  text-overflow: ellipsis;

}
.cal-event.late { background: var(--late-soft); border-color: var(--late); color: var(--late); }
.cal-event.appointment { background: var(--surface-2); border-color: var(--ink-3); }
.cal-head {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  margin-bottom: 1px;
}
.cal-head-cell {
  padding: 10px 8px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.cal-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.cal-month {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.cal-nav { display: flex; gap: 6px; }
.cal-nav button {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: grid; place-items: center;
  color: var(--ink-2);
  transition: background .15s;
}
.cal-nav button:hover { background: var(--surface-2); }
.cal-nav svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.cal-sync {
  font-size: 12px;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 6px;
}
.cal-sync::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--done);
  border-radius: 50%;
}

/* ============================================================
   Task detail
   ============================================================ */
.detail {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 32px;
  max-width: 900px;
}
.detail-main { display: flex; flex-direction: column; gap: 24px; }
.detail-title {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: -0.02em;
}
.detail-meta-row {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 14px;
  color: var(--ink-2);
}
.detail-meta-item { display: flex; align-items: center; gap: 8px; }
.detail-meta-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; color: var(--ink-3); }

.detail-section { display: flex; flex-direction: column; gap: 10px; }
.detail-section-label {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 500;
}

.origin-note {
  font-family: 'Fraunces', serif;
  font-size: 16px;
  line-height: 1.6;
  color: var(--ink-2);
  padding: 16px 18px;
  background: var(--surface);
  border-radius: 12px;
  border-left: 3px solid var(--accent);
  font-style: italic;
}
.origin-note::before {
  content: 'Note d'origine';
  display: block;
  font-family: 'Inter', sans-serif;
  font-style: normal;
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 500;
  margin-bottom: 6px;
}

.subtasks { display: flex; flex-direction: column; gap: 4px; }
.subtask {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  transition: background .15s;
  cursor: pointer;
}
.subtask:hover { background: var(--surface); }
.subtask .checkbox { width: 18px; height: 18px; }
.subtask.done .subtask-text { color: var(--ink-3); text-decoration: line-through; }
.subtask-text { font-size: 14px; }

.detail-aside {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 22px;
  background: var(--surface);
  border-radius: var(--radius);
  height: fit-content;
}
.aside-row { display: flex; flex-direction: column; gap: 6px; }
.aside-label { font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; }
.aside-value { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
.aside-value .pmark { width: 10px; height: 10px; }

.detail-actions { display: flex; gap: 10px; margin-top: 8px; }
.detail-actions button { flex: 1; padding: 12px; border-radius: 10px; font-weight: 500; font-size: 14px; min-height: 44px; }
.btn-done { background: var(--done); color: white; }
.btn-late { background: var(--late); color: white; }
.btn-ghost-line { background: var(--surface-2); color: var(--ink-2); }

/* ============================================================
   Registre
   ============================================================ */
.registre-group { margin-bottom: 32px; }
.registre-date {
  font-family: 'Fraunces', serif;
  font-size: 16px;
  font-weight: 500;
  color: var(--ink-2);
  margin-bottom: 8px;
  padding: 0 4px;
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.registre-date .weekday { color: var(--ink-3); font-size: 13px; font-family: 'Inter', sans-serif; font-weight: 400; }
.registre-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 14px;
  transition: background .15s;
}
.registre-row:hover { background: var(--surface); }
.registre-row .checkbox { width: 16px; height: 16px; }
.registre-row.done .registre-title { color: var(--ink-3); text-decoration: line-through; }
.registre-title { flex: 1; }
.registre-time { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ============================================================
   Vision
   ============================================================ */
.vision-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}
.vision-card {
  padding: 22px;
  background: var(--surface);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.vision-card-head { display: flex; align-items: center; gap: 12px; }
.vision-card-head .project-mark { width: 18px; height: 18px; }
.vision-card-head .project-mark.shape-triangle::before {
  border-left: 9px solid transparent;
  border-right: 9px solid transparent;
  border-bottom: 15px solid var(--p-color);
}
.vision-card-head .project-mark.shape-diamond::before { width: 13px; height: 13px; inset: 2px; }
.vision-card-name { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; }
.vision-stats { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-2); }
.vision-stat { display: flex; justify-content: space-between; }
.vision-stat-label { color: var(--ink-3); }
.vision-bar {
  height: 4px;
  background: var(--surface-2);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}
.vision-bar-fill { height: 100%; background: var(--p-color); border-radius: 2px; transition: width .4s ease; }

/* ============================================================
   Mobile
   ============================================================ */
.mobile-frame {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  flex-direction: column;
}
.mobile-frame.open { display: flex; }

.mobile-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  flex-shrink: 0;
}
.mobile-topbar h1 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 500; }
.mobile-topbar .brand-mark { width: 24px; height: 24px; }
.mobile-topbar .brand-mark::after { inset: 5px; }

.mobile-content {
  flex: 1;
  overflow-y: auto;
  padding: 18px 16px 100px;
  -webkit-overflow-scrolling: touch;
}

.mobile-tabs {
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--line);
  flex-shrink: 0;
}
.mobile-tab {
  flex: 1;
  padding: 12px 4px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--ink-3);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.02em;
  transition: color .15s;
  min-height: 60px;
}
.mobile-tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.mobile-tab.active { color: var(--accent); }

.mobile-mic-fab {
  position: absolute;
  bottom: 80px;
  right: 18px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--surface);
  display: grid; place-items: center;
  box-shadow: var(--shadow-lg);
  z-index: 10;
}
.mobile-mic-fab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }

.mobile-section { margin-bottom: 24px; }
.mobile-section-title {
  font-family: 'Fraunces', serif;
  font-size: 17px;
  font-weight: 500;
  margin-bottom: 10px;
  padding: 0 2px;
}
.mobile-task {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 14px;
  border-radius: 12px;
  background: var(--surface);
  margin-bottom: 8px;
  transition: transform .15s;
}
.mobile-task.late { background: var(--late-soft); }
.mobile-task .checkbox { width: 22px; height: 22px; }
.mobile-task-body { flex: 1; min-width: 0; }
.mobile-task-title { font-size: 15px; font-weight: 500; line-height: 1.35; }
.mobile-task-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
.mobile-task-actions { display: flex; gap: 6px; margin-top: 10px; }
.mobile-task-actions .task-action { flex: 1; justify-content: center; }

.mobile-dictation {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 30;
  display: none;
  flex-direction: column;
  padding: 24px 20px;
}
.mobile-dictation.open { display: flex; }
.mobile-dictation-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.mobile-dictation-status {
  font-size: 12px;
  color: var(--accent);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}
.mobile-dictation-status::before {
  content: '';
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  animation: blink 1s ease-in-out infinite;
}
.mobile-dictation .transcript { flex: 1; font-size: 19px; line-height: 1.55; }
.mobile-dictation-mic {
  align-self: center;
  width: 72px; height: 72px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: grid; place-items: center;
  margin: 24px 0;
  position: relative;
}
.mobile-dictation-mic::before {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  animation: pulse 1.5s ease-out infinite;
}
.mobile-dictation-mic svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.mobile-dictation-actions { display: flex; gap: 10px; }
.mobile-dictation-actions .btn-primary { flex: 1; justify-content: center; }

/* ============================================================
   Toast
   ============================================================ */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--surface);
  padding: 12px 22px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  transition: all .25s ease;
  z-index: 300;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 10px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ============================================================
   Reduced motion
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .topbar { padding: 14px 18px; }
  .content { padding: 18px 16px 80px; }
  .view-switch { display: none; }
  .detail { grid-template-columns: 1fr; }
  .device-toggle { display: flex; }
  .dictation { display: none; }
}
@media (min-width: 901px) {
  .device-toggle { display: flex; }
}

<script>
/* ============================================================

const projects = {

let tasks = [

  { id: 7, title: "Préparer la présentation de lundi", project: 'epitech', time: null, date: '2024-11-13', done: false, late: false, note: "Préparer les slides pour la présentation de lundi prochain.", subtasks: [{t:"Plan général",done:false},{t:"Slides 1 à 5",done:false},{t:"Slides 6 à 10",done:false}] },
  { id: 8, title: "Rendez-vous coiffeur", project: 'perso', time: '16:00', date: '2024-11-14', done: false, late: false, appointment: true, note: "Rendez-vous coiffeur jeudi 16h.", subtasks: [] },
  { id: 9, title: "Relire l'article sur les pensions", project: 'articles', time: null, date: '2024-11-13', done: false, late: false, note: "Relire l'article sur les pensions avant publication.", subtasks: [] },
  { id: 10, title: "Payer la facture EDF", project: 'admin', time: null, date: '2024-11-08', done: false, late: true, note: "Payer la facture EDF qui est en retard.", subtasks: [] },

let kanbanColumns = [

const sampleDictation = "Alors aujourd'hui il faut que j'appelle le comptable pour la TVA, je dois aussi aller courir 30 minutes ce matin, et j'ai un entretien Epitech avec Léa à 14 heures. Ah et il faut que je poste 10 articles sur le blog cette semaine.";
const sampleParsed = [
  { title: "Appeler le comptable pour la TVA", time: null, project: 'admin' },
  { title: "Aller courir 30 minutes", time: '07:00', project: 'sante' },
  { title: "Entretien Epitech avec Léa", time: '14:00', project: 'epitech', appointment: true },
  { title: "Poster 10 articles sur le blog", time: null, project: 'articles' },
];

/* ============================================================
   STATE
   ============================================================ */
let currentView = 'plan';

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

function pmark(project, cls = '') {
  const p = projects[project];
  if (!p) return '';
  return `<span class="pmark shape-${p.shape} ${cls}" style="--p-color: ${p.color}"></span>`;
}

function taskProjectTag(project) {
  const p = projects[project];
  if (!p) return '';
  return `<span class="task-project" style="--p-color: ${p.color}">${pmark(project)}${p.name}</span>`;
}

function toast(msg) {
  const t = $('#toast');
  $('#toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   VIEW RENDERERS
   ============================================================ */
function renderView(view) {
  const content = $('#content');
  const title = $('#viewTitle');
  const sub = $('#viewSub');

  const titles = {
    plan: { t: 'Plan du jour', s: 'Mardi 12 novembre' },
    liste: { t: 'Liste', s: 'Toutes les tâches en cours' },
    kanban: { t: 'Kanban', s: 'Glisse les cartes entre les colonnes' },
    calendrier: { t: 'Calendrier', s: 'Synchronisé avec Apple Calendrier' },
    registre: { t: 'Registre', s: 'Tout ce qui a été fait' },
    vision: { t: 'Vision', s: 'Tes projets d\'un côté' },
    detail: { t: 'Fiche tâche', s: 'Détails et note d\'origine' },
  };

  title.textContent = titles[view]?.t || view;
  sub.textContent = titles[view]?.s || '';

  switch (view) {
    case 'plan': content.innerHTML = viewPlan(); break;
    case 'liste': content.innerHTML = viewListe(); break;
    case 'kanban': content.innerHTML = viewKanban(); break;
    case 'calendrier': content.innerHTML = viewCalendrier(); break;
    case 'registre': content.innerHTML = viewRegistre(); break;
    case 'vision': content.innerHTML = viewVision(); break;
    case 'detail': content.innerHTML = viewDetail(); break;
  }

  attachInteractions();
}

function viewPlan() {
  const late = tasks.filter(t => t.late && !t.done);
  const now = tasks.filter(t => !t.late && !t.done && !t.appointment && t.date === '2024-11-12');
  const appointments = tasks.filter(t => t.appointment && !t.done && t.date === '2024-11-12');
  const next = tasks.filter(t => !t.late && !t.done && !t.appointment && t.date > '2024-11-12');
  const doneToday = tasks.filter(t => t.done && t.date === '2024-11-12');

  const section = (title, items, count) => {
    if (!items.length && title !== 'En retard') return '';
    return `
      <div class="day-section">
        <div class="day-section-head">
          <span class="day-section-title">${title}</span>
          <span class="day-section-count">${count ?? items.length}</span>
          <span class="day-section-line"></span>
        </div>
        ${items.map(taskRow).join('')}
      </div>
    `;
  };

  return `
    ${section('En retard', late)}
    ${section('Maintenant', now)}
    ${section('Rendez-vous', appointments)}
    ${section('Ensuite', next)}
    ${doneToday.length ? section('Fait aujourd\'hui', doneToday) : ''}
  `;
}

function taskRow(t) {
  const p = projects[t.project];
  return `
    <div class="task ${t.done ? 'done' : ''} ${t.late ? 'late' : ''}" data-task="${t.id}">
      <div class="checkbox ${t.done ? 'checked' : ''}" data-toggle="${t.id}"></div>
      <div class="task-body">
        <div class="task-title">${t.title}</div>
        <div class="task-meta">
          ${taskProjectTag(t.project)}
          ${t.time ? `<span class="task-time">${t.time}</span>` : ''}
          ${t.late && !t.done ? `<span class="task-late-badge">En retard</span>` : ''}
        </div>
      </div>
      <div class="task-actions">
        ${t.late && !t.done ? `
          <button class="task-action primary" data-done="${t.id}">
            <svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>
            Fait
          </button>
          <button class="task-action" data-shift="${t.id}">
            <svg viewBox="0 0 24 24"><path d="M3 12h18M13 6l8 6-8 6"/></svg>
            Décaler
          </button>
        ` : ''}
        <button class="task-action" data-open="${t.id}">
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  `;
}

function viewListe() {
  const grouped = {};
  tasks.filter(t => !t.done).forEach(t => {
    if (!grouped[t.project]) grouped[t.project] = [];
    grouped[t.project].push(t);
  });

  return Object.entries(grouped).map(([proj, items]) => {
    const p = projects[proj];
    return `
      <div class="day-section">
        <div class="day-section-head">
          <span class="project-mark shape-${p.shape}" style="--p-color: ${p.color}; width:14px; height:14px; position:relative; align-self:center;"></span>
          <span class="day-section-title">${p.name}</span>
          <span class="day-section-count">${items.length}</span>
          <span class="day-section-line"></span>
        </div>
        ${items.map(taskRow).join('')}
      </div>
    `;
  }).join('');
}

function viewKanban() {
  return `
    <div class="kanban" id="kanbanBoard">
      ${kanbanColumns.map(col => `
        <div class="kanban-column" data-col="${col.id}">
          <div class="kanban-col-head">
            <span class="kanban-col-title">${col.name}</span>
            <span class="kanban-col-count">${col.tasks.length}</span>
          </div>
          ${col.tasks.map(id => {
            const t = tasks.find(x => x.id === id);
            if (!t) return '';
            const p = projects[t.project];
            return `
              <div class="kanban-card" draggable="true" data-card="${t.id}" data-col="${col.id}">
                <div class="kanban-card-title">${t.title}</div>
                <div class="kanban-card-meta">
                  ${pmark(t.project)}
                  <span>${p.name}</span>
                  ${t.time ? `<span style="margin-left:auto">${t.time}</span>` : ''}
                </div>
              </div>
            `;
          }).join('')}
          <button class="kanban-add" data-add-col="${col.id}">+ Ajouter</button>
        </div>
      `).join('')}
    </div>
  `;
}

function viewCalendrier() {
  const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  // November 2024 starts on Friday (day 5 of week if Monday=0)
  const firstOffset = 4; // Nov 1 = Friday → offset 4 from Monday
  const daysInMonth = 30;
  const today = 12;

  let cells = '';
  // Previous month tail
  for (let i = 0; i < firstOffset; i++) {
    const d = 28 + i;
    cells += `<div class="cal-day other-month"><div class="cal-day-num">${d}</div></div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `2024-11-${String(d).padStart(2,'0')}`;
    const dayTasks = tasks.filter(t => t.date === dateStr);
    const isToday = d === today;
    cells += `
      <div class="cal-day ${isToday ? 'today' : ''}">
        <div class="cal-day-num">${d}</div>
        ${dayTasks.map(t => {
          const cls = t.late && !t.done ? 'late' : t.appointment ? 'appointment' : '';
          const p = projects[t.project];
          return `<div class="cal-event ${cls}" style="--p-color: ${p.color}; --p-soft: ${p.soft}">${t.time ? t.time + ' ' : ''}${t.title}</div>`;
        }).join('')}
      </div>
    `;
  }
  // Next month head
  const totalCells = firstOffset + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= trailing; i++) {
    cells += `<div class="cal-day other-month"><div class="cal-day-num">${i}</div></div>`;
  }

  return `
    <div class="cal-toolbar">
      <div class="cal-month">Novembre 2024</div>
      <div class="cal-sync">Synchronisé avec Apple — il y a 12 min</div>
      <div class="cal-nav">
        <button><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="cal-head">
      ${days.map(d => `<div class="cal-head-cell">${d}</div>`).join('')}
    </div>
    <div class="calendar">${cells}</div>
  `;
}

function viewRegistre() {
  // Group by date
  const byDate = {};
  tasks.forEach(t => {
    if (!byDate[t.date]) byDate[t.date] = [];
    byDate[t.date].push(t);
  });

  const weekdays = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

  return Object.entries(byDate).sort((a,b) => b[0].localeCompare(a[0])).map(([date, items]) => {
    const d = new Date(date + 'T00:00');
    const wd = weekdays[d.getDay()];
    const day = d.getDate();
    const mo = months[d.getMonth()];
    return `
      <div class="registre-group">
        <div class="registre-date">${day} ${mo} <span class="weekday">${wd}</span></div>
        ${items.map(t => `
          <div class="registre-row ${t.done ? 'done' : ''}">
            <div class="checkbox ${t.done ? 'checked' : ''}" data-toggle="${t.id}"></div>
            <span class="registre-title">${t.title}</span>
            ${pmark(t.project)}
            ${t.time ? `<span class="registre-time">${t.time}</span>` : ''}
          </div>
        `).join('')}
      </div>
    `;
  }).join('');
}

function viewVision() {
  const projStats = Object.entries(projects).map(([key, p]) => {
    const all = tasks.filter(t => t.project === key);
    const done = all.filter(t => t.done).length;
    const late = all.filter(t => t.late && !t.done).length;
    const pct = all.length ? Math.round(done / all.length * 100) : 0;
    return { key, p, total: all.length, done, late, pct };
  });

  return `
    <div class="vision-grid">
      ${projStats.map(({key, p, total, done, late, pct}) => `
        <div class="vision-card" style="--p-color: ${p.color}; --p-soft: ${p.soft}">
          <div class="vision-card-head">
            <span class="project-mark shape-${p.shape}"></span>
            <span class="vision-card-name">${p.name}</span>
          </div>
          <div class="vision-stats">
            <div class="vision-stat"><span class="vision-stat-label">Tâches</span><span>${total}</span></div>
            <div class="vision-stat"><span class="vision-stat-label">Faites</span><span>${done}</span></div>
            <div class="vision-stat"><span class="vision-stat-label">En retard</span><span>${late}</span></div>
          </div>
          <div class="vision-bar"><div class="vision-bar-fill" style="width: ${pct}%"></div></div>
        </div>
      `).join('')}
    </div>
  `;
}

function viewDetail() {
  const t = tasks.find(x => x.id === currentDetailId);
  if (!t) return '<p>Tâche introuvable.</p>';
  const p = projects[t.project];
  return `
    <div class="detail">
      <div class="detail-main">
        <div class="detail-title">${t.title}</div>
        <div class="detail-meta-row">
          <span class="detail-meta-item">${pmark(t.project)} ${p.name}</span>
          ${t.time ? `<span class="detail-meta-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> ${t.time}</span>` : ''}
          ${t.appointment ? `<span class="detail-meta-item"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg> Rendez-vous</span>` : ''}
        </div>

        <div class="detail-section">
          <div class="detail-section-label">Note d'origine</div>
          <div class="origin-note">${t.note}</div>
        </div>

        ${t.subtasks && t.subtasks.length ? `
          <div class="detail-section">
            <div class="detail-section-label">Sous-tâches</div>
            <div class="subtasks">
              ${t.subtasks.map((s, i) => `
                <div class="subtask ${s.done ? 'done' : ''}" data-subtask="${t.id}-${i}">
                  <div class="checkbox ${s.done ? 'checked' : ''}"></div>
                  <span class="subtask-text">${s.t}</span>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <div class="detail-actions">
          <button class="btn-done" data-done-detail="${t.id}">Marquer fait</button>
          <button class="btn-ghost-line" data-shift-detail="${t.id}">Décaler</button>
        </div>
      </div>

      <div class="detail-aside">
        <div class="aside-row">
          <span class="aside-label">Projet</span>
          <span class="aside-value">${pmark(t.project)} ${p.name}</span>
        </div>
        <div class="aside-row">
          <span class="aside-label">Quand</span>
          <span class="aside-value">${t.time || 'Pas d\'heure'}</span>
        </div>
        <div class="aside-row">
          <span class="aside-label">Statut</span>
          <span class="aside-value">${t.done ? 'Fait' : t.late ? 'En retard' : 'À faire'}</span>
        </div>
      </div>
    </div>
  `;
}

  const content = $('#mobileContent');
  const title = $('#mobileTitle');
  const titles = { plan: 'Plan du jour', liste: 'Liste', kanban: 'Kanban', registre: 'Registre' };
  title.textContent = titles[view] || view;

  if (view === 'plan') {
    const late = tasks.filter(t => t.late && !t.done);
    const now = tasks.filter(t => !t.late && !t.done && !t.appointment && t.date === '2024-11-12');
    const appointments = tasks.filter(t => t.appointment && !t.done && t.date === '2024-11-12');
    const next = tasks.filter(t => !t.late && !t.done && !t.appointment && t.date > '2024-11-12');

    const section = (title, items) => {
      if (!items.length) return '';
      return `
        <div class="mobile-section">
          <div class="mobile-section-title">${title}</div>
          ${items.map(mobileTaskRow).join('')}
        </div>
      `;
    };

    content.innerHTML = section('En retard', late) + section('Maintenant', now) + section('Rendez-vous', appointments) + section('Ensuite', next);
  } else if (view === 'liste') {
    const grouped = {};
    tasks.filter(t => !t.done).forEach(t => {
      if (!grouped[t.project]) grouped[t.project] = [];
      grouped[t.project].push(t);
    });
    content.innerHTML = Object.entries(grouped).map(([proj, items]) => {
      const p = projects[proj];
      return `
        <div class="mobile-section">
          <div class="mobile-section-title" style="display:flex;align-items:center;gap:8px">
            <span class="project-mark shape-${p.shape}" style="--p-color:${p.color};width:12px;height:12px;position:relative"></span>
            ${p.name}
          </div>
          ${items.map(mobileTaskRow).join('')}
        </div>
      `;
    }).join('');
  } else if (view === 'kanban') {
    content.innerHTML = `
      <div class="kanban" style="padding-bottom:20px">
        ${kanbanColumns.map(col => `
          <div class="kanban-column" data-col="${col.id}" style="flex:0 0 260px;max-height:none">
            <div class="kanban-col-head">
              <span class="kanban-col-title">${col.name}</span>
              <span class="kanban-col-count">${col.tasks.length}</span>
            </div>
            ${col.tasks.map(id => {
              const t = tasks.find(x => x.id === id);
              if (!t) return '';
              const p = projects[t.project];
              return `
                <div class="kanban-card" draggable="true" data-card="${t.id}" data-col="${col.id}">
                  <div class="kanban-card-title">${t.title}</div>
                  <div class="kanban-card-meta">
                    ${pmark(t.project)}
                    <span>${p.name}</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `).join('')}
      </div>
    `;
  } else if (view === 'registre') {
    const byDate = {};
    tasks.forEach(t => {
      if (!byDate[t.date]) byDate[t.date] = [];
      byDate[t.date].push(t);
    });
    const weekdays = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
    const months = ['jan','fév','mar','avr','mai','juin','juil','août','sept','oct','nov','déc'];
    content.innerHTML = Object.entries(byDate).sort((a,b) => b[0].localeCompare(a[0])).map(([date, items]) => {
      const d = new Date(date + 'T00:00');
      return `
        <div class="mobile-section">
          <div class="mobile-section-title">${weekdays[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}</div>
          ${items.map(t => `
            <div class="registre-row ${t.done ? 'done' : ''}" style="background:var(--surface);margin-bottom:6px">
              <div class="checkbox ${t.done ? 'checked' : ''}" data-toggle="${t.id}"></div>
              <span class="registre-title">${t.title}</span>
              ${pmark(t.project)}
            </div>
          `).join('')}
        </div>
      `;
    }).join('');
  }

  attachMobileInteractions();
}

function mobileTaskRow(t) {
  return `
    <div class="mobile-task ${t.late ? 'late' : ''} ${t.done ? 'done' : ''}" data-task="${t.id}">
      <div class="checkbox ${t.done ? 'checked' : ''}" data-toggle="${t.id}"></div>
      <div class="mobile-task-body">
        <div class="mobile-task-title">${t.title}</div>
        <div class="mobile-task-meta">
          ${taskProjectTag(t.project)}
          ${t.time ? `<span>${t.time}</span>` : ''}
          ${t.late && !t.done ? `<span class="task-late-badge">En retard</span>` : ''}
        </div>
        ${t.late && !t.done ? `
          <div class="mobile-task-actions">
            <button class="task-action primary" data-done="${t.id}">Fait</button>
            <button class="task-action" data-shift="${t.id}">Décaler</button>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
let currentDetailId = null;

function attachInteractions() {
  // Toggle task
  $$('[data-toggle]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = +el.dataset.toggle;
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      t.done = !t.done;
      if (t.done) {
        t.late = false;
        toast('C\'est fait');
        // Trigger triage for new completed task? No—triage is for new tasks.
        // But we can show triage when checking an unassigned task. Here all tasks have projects.
      }
      renderView(currentView);
      if (isMobile) renderMobile(currentMobileView);
    });
  });

  // Done (late task action)
  $$('[data-done]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = +el.dataset.done;
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      pendingConfirmTask = t;
      $('#confirmTaskText').textContent = t.title;
      $('#confirmModal').classList.add('open');
    });
  });

  // Shift
  $$('[data-shift]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = +el.dataset.shift;
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      t.late = false;
      t.date = '2024-11-13';
      toast('Décalé à demain');
      renderView(currentView);
      if (isMobile) renderMobile(currentMobileView);
    });
  });

  // Open detail
  $$('[data-open]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      currentDetailId = +el.dataset.open;
      renderView('detail');
    });
  });
  $$('.task').forEach(el => {
    if (!el.dataset.task) return;
    el.addEventListener('click', () => {
      currentDetailId = +el.dataset.task;
      renderView('detail');
    });
  });

  // Detail actions
  $$('[data-done-detail]').forEach(el => {
    el.addEventListener('click', () => {
      const id = +el.dataset.doneDetail;
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      t.done = true;
      t.late = false;
      toast('C\'est fait');
      renderView('plan');
    });
  });
  $$('[data-shift-detail]').forEach(el => {
    el.addEventListener('click', () => {
      const id = +el.dataset.shiftDetail;
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      t.late = false;
      t.date = '2024-11-13';
      toast('Décalé à demain');
      renderView('plan');
    });
  });

  // Subtasks
  $$('[data-subtask]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const [taskId, idx] = el.dataset.subtask.split('-').map(Number);
      const t = tasks.find(x => x.id === taskId);
      if (!t) return;
      t.subtasks[idx].done = !t.subtasks[idx].done;
      renderView('detail');
    });
  });

  // Kanban drag & drop
  setupKanban();
}

function attachMobileInteractions() {
  $$('[data-toggle]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = +el.dataset.toggle;
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      t.done = !t.done;
      if (t.done) { t.late = false; toast('C\'est fait'); }
      renderMobile(currentMobileView);
    });
  });
  $$('[data-done]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = +el.dataset.done;
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      pendingConfirmTask = t;
      $('#confirmTaskText').textContent = t.title;
      $('#confirmModal').classList.add('open');
    });
  });
  $$('[data-shift]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = +el.dataset.shift;
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      t.late = false;
      t.date = '2024-11-13';
      toast('Décalé à demain');
      renderMobile(currentMobileView);
    });
  });
  setupKanban();
}

function setupKanban() {
  let dragging = null;
  $$('.kanban-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      dragging = card;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      if (dragging) dragging.classList.remove('dragging');
      dragging = null;
      $$('.kanban-column').forEach(c => c.classList.remove('drag-over'));
    });
  });

  $$('.kanban-column').forEach(col => {
    col.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      if (!dragging) return;
      const taskId = +dragging.dataset.card;
      const fromCol = dragging.dataset.col;
      const toCol = col.dataset.col;
      if (fromCol === toCol) return;

      // Move in data
      const from = kanbanColumns.find(c => c.id === fromCol);
      const to = kanbanColumns.find(c => c.id === toCol);
      from.tasks = from.tasks.filter(id => id !== taskId);
      to.tasks.push(taskId);

      // If dropped on "done" column, mark task done
      if (toCol === 'done') {
        const t = tasks.find(x => x.id === taskId);
        if (t) { t.done = true; t.late = false; toast('C\'est fait'); }
      } else {
        const t = tasks.find(x => x.id === taskId);
        if (t) t.done = false;
      }

      renderView(currentView);
      if (isMobile) renderMobile(currentMobileView);
    });
  });
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function setView(view) {
  currentView = view;
  $$('#viewSwitch button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  renderView(view);
}

$$('#viewSwitch button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
$$('.nav-item[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

/* ============================================================
   THEME
   ============================================================ */
function toggleTheme() {
  const html = document.documentElement;
  const cur = html.dataset.theme;
  const next = cur === 'dark' ? 'light' : 'dark';
  html.dataset.theme = next;
}
$('#themeToggle').addEventListener('click', toggleTheme);
$('#themeToggleMobile').addEventListener('click', toggleTheme);

/* ============================================================
   DEVICE TOGGLE
   ============================================================ */
function setDevice(mobile) {
  isMobile = mobile;
  $('#mobileFrame').classList.toggle('open', mobile);
  $('#deviceDesktop').classList.toggle('active', !mobile);
  $('#deviceMobile').classList.toggle('active', mobile);
  if (mobile) {
    renderMobile(currentMobileView);
  } else {
    renderView(currentView);
  }
}
$('#deviceDesktop').addEventListener('click', () => setDevice(false));
$('#deviceMobile').addEventListener('click', () => setDevice(true));

/* ============================================================
   MOBILE TABS
   ============================================================ */
$$('.mobile-tab').forEach(b => b.addEventListener('click', () => {
  currentMobileView = b.dataset.mview;
  $$('.mobile-tab').forEach(x => x.classList.toggle('active', x === b));
  renderMobile(currentMobileView);
}));

/* ============================================================
   DICTATION (desktop)
   ============================================================ */
function openDictation(panel, transcriptEl, parsedEl) {
  panel.classList.add('open');
  $('#micFab')?.classList.add('listening');
  const typed = transcriptEl.querySelector('.typed');
  typed.textContent = '';
  parsedEl.innerHTML = '';
  let i = 0;
  const text = sampleDictation;
  function type() {
    if (i < text.length) {
      typed.textContent += text[i++];
      setTimeout(type, 22);
    } else {
      showParsed(parsedEl);
    }
  }
  setTimeout(type, 400);
}

function showParsed(parsedEl) {
  parsedEl.innerHTML = sampleParsed.map(p => `
    <div class="parsed-task">
      <div class="checkbox"></div>
      <span class="parsed-task-title">${p.title}</span>
      ${p.time ? `<span class="parsed-task-time">${p.time}</span>` : ''}
    </div>
  `).join('');
}

$('#micFab').addEventListener('click', () => {
  const panel = $('#dictationPanel');
  if (panel.classList.contains('open')) {
    closeDictation();
  } else {
    openDictation(panel, $('#transcript'), $('#parsedTasks'));
  }
});
$('#dictateBtn').addEventListener('click', () => {
  openDictation($('#dictationPanel'), $('#transcript'), $('#parsedTasks'));
});
$('#dictationClose').addEventListener('click', closeDictation);
function closeDictation() {
  $('#dictationPanel').classList.remove('open');
  $('#micFab').classList.remove('listening');
}

$('#dictateConfirm').addEventListener('click', () => {
  closeDictation();
  // Trigger triage for the first parsed task
  pendingTriageTask = { title: sampleParsed[0].title, project: sampleParsed[0].project };
  $('#triageTaskPreview').textContent = pendingTriageTask.title;
  $('#triageModal').classList.add('open');
});

$('#dictateDiscard').addEventListener('click', () => {
  openDictation($('#dictationPanel'), $('#transcript'), $('#parsedTasks'));
});

/* ============================================================
   MOBILE DICTATION
   ============================================================ */
$('#mobileMicFab').addEventListener('click', () => {
  $('#mobileDictation').classList.add('open');
  openDictation($('#mobileDictation'), $('#mobileTranscript'), $('#mobileParsedTasks'));
});
$('#mobileDictationClose').addEventListener('click', () => {
  $('#mobileDictation').classList.remove('open');
});
$('#mobileDictationConfirm').addEventListener('click', () => {
  $('#mobileDictation').classList.remove('open');
  pendingTriageTask = { title: sampleParsed[0].title, project: sampleParsed[0].project };
  $('#triageTaskPreview').textContent = pendingTriageTask.title;
  $('#triageModal').classList.add('open');
});
$('#mobileDictationDiscard').addEventListener('click', () => {
  openDictation($('#mobileDictation'), $('#mobileTranscript'), $('#mobileParsedTasks'));
});

/* ============================================================
   TRIAGE MODAL
   ============================================================ */
$$('#projectPicker .pick-project').forEach(b => b.addEventListener('click', () => {
  $$('#projectPicker .pick-project').forEach(x => x.classList.remove('selected'));
  b.classList.add('selected');
  selectedProject = b.dataset.project;
  $('#triageConfirm').disabled = false;
}));

$('#triageConfirm').addEventListener('click', () => {
  if (!selectedProject || !pendingTriageTask) return;
  // Add the task
  const newTask = {
    id: Date.now(),
    title: pendingTriageTask.title,
    project: selectedProject,
    time: sampleParsed[0].time,
    date: '2024-11-12',
    done: false,
    late: false,
    note: sampleDictation,
    subtasks: []
  };
  tasks.unshift(newTask);
  $('#triageModal').classList.remove('open');
  toast('C\'est noté');
  selectedProject = null;
  pendingTriageTask = null;
  $$('#projectPicker .pick-project').forEach(x => x.classList.remove('selected'));
  $('#triageConfirm').disabled = true;
  renderView(currentView);
  if (isMobile) renderMobile(currentMobileView);
});

$('#triageSkip').addEventListener('click', () => {
  $('#triageModal').classList.remove('open');
  selectedProject = null;
  $$('#projectPicker .pick-project').forEach(x => x.classList.remove('selected'));
  $('#triageConfirm').disabled = true;
});

/* ============================================================
   CONFIRM MODAL
   ============================================================ */
$('#confirmYes').addEventListener('click', () => {
  if (pendingConfirmTask) {
    pendingConfirmTask.done = true;
    pendingConfirmTask.late = false;
    toast('C\'est fait');
    pendingConfirmTask = null;
  }
  $('#confirmModal').classList.remove('open');
  renderView(currentView);
  if (isMobile) renderMobile(currentMobileView);
});
$('#confirmNo').addEventListener('click', () => {
  if (pendingConfirmTask) {
    pendingConfirmTask.late = false;
    pendingConfirmTask.date = '2024-11-13';
    toast('Décalé à demain');
    pendingConfirmTask = null;
  }
  $('#confirmModal').classList.remove('open');
  renderView(currentView);
  if (isMobile) renderMobile(currentMobileView);
});

/* ============================================================
   INIT
   ============================================================ */
renderView('plan');

// Auto-detect mobile on small screens
if (window.innerWidth < 900) {
  setDevice(true);
}

window.addEventListener('resize', () => {
  if (window.innerWidth < 900 && !isMobile) {
    setDevice(true);
  }
});
</script>
